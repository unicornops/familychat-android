name: Emulator smoke

# First proof that the built app launches on a device (unicornops/familychat-android#8). It builds the F-Droid
# flavour as a minified (R8) release, which is signed with the debug key when no release keystore is configured
# (app/build.gradle.kts), so no secret is needed. It runs the Maestro flows listed in .maestro/smokeTests.yaml.
#
# Not included on purpose: .maestro/tests/account/loginWithSignInCode.yaml. A sign-in code is single-use and valid
# for five minutes, so it must be minted from a parent session on the control panel right before the run, and this
# repository holds no credentials for that. It stays a manual or cross-repository run (see #8).
#
# Triggered by hand, and by pull requests that touch this workflow or the Maestro flows only, so it does not run on
# every PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - '.github/workflows/scripts/emulator-smoke.sh'
      - '.maestro/**'

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache
  MAESTRO_VERSION: 2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7

jobs:
  smoke:
    name: Maestro smoke on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: emulator-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/familychat' }}
      - name: Assemble the minified F-Droid release APK (debug-signed)
        run: ./gradlew :app:assembleFdroidRelease $CI_GRADLE_ARG_PROPERTIES
      - name: Locate the APK
        run: |
          apk=$(ls app/build/outputs/apk/fdroid/release/*-universal-release.apk)
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "Testing $apk"

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APP_ID: family.safechat.android
          OUT: ${{ runner.temp }}/smoke-out
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./.github/workflows/scripts/emulator-smoke.sh

      - name: Upload screenshots, recording and logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-smoke
          path: ${{ runner.temp }}/smoke-out/
          if-no-files-found: warn

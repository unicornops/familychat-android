# Family Chat release pipeline (#7, docs/RELEASING.md). A tag v<upstream version>-fc.<n> on familychat builds:
# - the F-Droid-flavour APKs (UnifiedPush only), signed with the direct-distribution key, attached to a GitHub
#   pre-release with its R8 mapping, a CycloneDX SBOM, SHA256SUMS and build provenance attestations;
# - the Play AAB, signed with the upload key, sent to the Play internal testing track once the Play credentials exist.
# Every secret lives in the protected `release` environment (Rob is the required reviewer), used by the build job only:
# one approval per release. The gate and GitHub release jobs have no secrets.

name: Release

on:
  push:
    tags: [ 'v*-fc.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build again, e.g. v26.09.4-fc.1'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  gate:
    name: Check the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      fc: ${{ steps.tag.outputs.fc }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, its branch and its CI
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./.github/workflows/scripts/release-gate.sh

  build:
    name: Build and sign
    needs: gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # No shared cache for release builds: nothing a PR run could have written gets into a signed build.
          cache-disabled: true
      - name: Build the F-Droid APK, signed with the direct-distribution key
        env:
          FC: ${{ needs.gate.outputs.fc }}
          KEYSTORE_BASE64: ${{ secrets.DIRECT_KEYSTORE_BASE64 }}
          FAMILYCHAT_RELEASE_STORE_PASSWORD: ${{ secrets.DIRECT_STORE_PASSWORD }}
          FAMILYCHAT_RELEASE_KEY_ALIAS: ${{ secrets.DIRECT_KEY_ALIAS }}
          FAMILYCHAT_RELEASE_KEY_PASSWORD: ${{ secrets.DIRECT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DIRECT_KEYSTORE_BASE64 is not set in the release environment (docs/RELEASING.md)"
            exit 1
          fi
          export FAMILYCHAT_RELEASE_KEYSTORE="$RUNNER_TEMP/direct.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FAMILYCHAT_RELEASE_KEYSTORE"
          ./gradlew :app:assembleFdroidRelease "-Pfamilychat.fc=$FC" $CI_GRADLE_ARG_PROPERTIES
          rm -f "$FAMILYCHAT_RELEASE_KEYSTORE"
      - name: Build the Play AAB, signed with the upload key
        id: aab
        env:
          FC: ${{ needs.gate.outputs.fc }}
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          FAMILYCHAT_RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FAMILYCHAT_RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FAMILYCHAT_RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::UPLOAD_KEYSTORE_BASE64 is not set yet: no Play AAB for this release (family-chat#240)"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export FAMILYCHAT_RELEASE_KEYSTORE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FAMILYCHAT_RELEASE_KEYSTORE"
          ./gradlew :app:bundleGplayRelease "-Pfamilychat.fc=$FC" $CI_GRADLE_ARG_PROPERTIES
          rm -f "$FAMILYCHAT_RELEASE_KEYSTORE"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Collect the release files
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          mkdir -p dist play
          # Per-ABI APKs are a third of the universal one's size: arm64-v8a fits almost every current phone.
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/fdroid/release/app-fdroid-$abi-release.apk" "dist/familychat-$TAG-$abi.apk"
          done
          cp app/build/outputs/mapping/fdroidRelease/mapping.txt "dist/familychat-$TAG-mapping.txt"
          if [ -d app/build/outputs/bundle/gplayRelease ]; then
            cp app/build/outputs/bundle/gplayRelease/*.aab "play/familychat-$TAG.aab"
            cp app/build/outputs/mapping/gplayRelease/mapping.txt play/mapping.txt
          fi
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/familychat-${{ needs.gate.outputs.tag }}-universal.apk
          format: cyclonedx-json
          output-file: dist/familychat-${{ needs.gate.outputs.tag }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Upload the GitHub release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.gate.outputs.tag }}
          path: dist/
          if-no-files-found: error
      # In this job rather than its own, so that one approval of the release environment covers the whole release.
      - name: Check for the Play credentials
        id: play
        if: steps.aab.outputs.built == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set yet: nothing sent to Play (family-chat#240)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to the Play internal track
        if: steps.play.outputs.present == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: family.safechat.android
          releaseFiles: play/familychat-${{ needs.gate.outputs.tag }}.aab
          mappingFile: play/mapping.txt
          track: internal
          status: completed

  github-release:
    name: Publish the GitHub pre-release
    needs: [ gate, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.gate.outputs.tag }}
          path: dist
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write the release notes
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: ./.github/workflows/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create or update the pre-release
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$REPO"
          else
            gh release create "$TAG" dist/* --prerelease --verify-tag \
              --title "Family Chat $TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$REPO"
          fi
